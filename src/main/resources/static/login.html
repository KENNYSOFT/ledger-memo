<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>로그인 · 가계부 메모</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f7f7f8; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e5e7eb; --muted:#9ca3af; --line:#2b3038; --accent:#60a5fa; --danger:#f87171; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); padding: 20px;
  }
  form {
    width: 100%; max-width: 320px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px; font-size: 16px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 18px; }
  button {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
  }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>가계부 메모</h1>
  <div class="error" id="error" hidden>아이디 또는 비밀번호가 올바르지 않습니다.</div>

  <label for="username">아이디</label>
  <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>

  <label for="password">비밀번호</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>

  <label class="remember">
    <input type="checkbox" name="remember-me" value="true" checked>
    로그인 유지
  </label>

  <input type="hidden" name="_csrf" id="csrf">
  <button type="submit">로그인</button>
</form>

<script>
  // Spring Security 가 내려준 CSRF 쿠키를 폼에 실어 보낸다.
  var match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
  if (match) document.getElementById('csrf').value = decodeURIComponent(match[1]);
  if (location.search.indexOf('error') !== -1) document.getElementById('error').hidden = false;
</script>
</body>
</html>
