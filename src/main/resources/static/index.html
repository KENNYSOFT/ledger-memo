<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>가계부 메모</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --danger: #dc2626;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --card: #1b1e24;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #2b3038;
      --accent: #60a5fa;
      --danger: #f87171;
      --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 4px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 8px 8px 0;
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  header button {
    flex: 1; padding: 10px 4px;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-size: 15px; font-weight: 600;
  }
  header button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  section[hidden] { display: none; }

  textarea#line {
    width: 100%; min-height: 76px; padding: 12px;
    font-size: 17px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); resize: vertical;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  button.primary {
    padding: 13px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
  }
  button.ghost {
    padding: 13px; font-size: 16px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
  }
  button:disabled { opacity: .5; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 8px; }
  .chip {
    font-size: 13px; padding: 5px 10px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .chip.amount { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chip.warn { color: var(--warn); border-color: var(--warn); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-bottom: 8px;
  }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .place { font-weight: 600; }
  .card .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  .card .raw { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-all; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 8px; }
  .card .actions { display: flex; gap: 6px; margin-top: 10px; }
  .card .actions button { flex: 1; padding: 8px; font-size: 13px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--text); }
  .card .actions button.done { color: var(--accent); border-color: var(--accent); }
  .card .actions button.del { color: var(--danger); border-color: var(--danger); }
  .card img.thumb { max-width: 100%; border-radius: 8px; margin-top: 8px; }

  h2.date { font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; }
  .filters input, .filters select {
    padding: 9px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text); min-width: 0;
  }
  .filters input { flex: 1; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #111; color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: .92; }
  #queued { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }

  header button { font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
  textarea#import-text {
    width: 100%; padding: 12px; font-size: 15px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); resize: vertical;
  }
  #import-result { margin-top: 12px; }
  .failed { border-color: var(--danger); }
  .failed .place { color: var(--danger); }

  /* 상세 시트 */
  .sheet {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, .45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet[hidden] { display: none; }
  .sheet-inner {
    background: var(--bg); width: 100%; max-width: 720px;
    max-height: 92vh; overflow-y: auto;
    border-radius: 14px 14px 0 0; padding: 12px 12px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-head {
    position: sticky; top: 0; background: var(--bg);
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  button.icon { background: none; border: none; color: var(--accent); font-size: 15px; padding: 6px; }

  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item-row { display: grid; grid-template-columns: 1fr 56px 96px 32px; gap: 6px; margin-bottom: 6px; }
  .item-row input { padding: 9px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); width: 100%; }
  .item-row button { border: none; background: none; color: var(--danger); font-size: 18px; }
  .person-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .person-row .name { flex: 1; font-weight: 600; }
  .person-row select, .person-row input { padding: 8px; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .person-row input.share { width: 100px; }
  /* 추천 태그 칩은 눌러서 넣는 것이므로 파싱 결과 칩과 달리 누를 수 있게 보여야 한다. */
  #d-tag-suggest .chip { cursor: pointer; color: var(--accent); border-color: var(--accent); }
  .settle-card { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .settle-card .amount { font-size: 17px; }
</style>
</head>
<body>
<header>
  <button id="tab-write" aria-selected="true">작성</button>
  <button id="tab-list" aria-selected="false">목록</button>
  <button id="tab-settle" aria-selected="false">정산</button>
  <button id="tab-import" aria-selected="false">임포트</button>
</header>

<main>
  <section id="view-write">
    <textarea id="line" rows="3" enterkeyhint="done"
              placeholder="원조해장촌 2인세트 4.5 소주2 1.0 맥주3 1.5"></textarea>
    <div class="chips" id="chips"></div>
    <div id="queued" hidden></div>

    <div class="row">
      <button class="ghost" id="btn-photo">사진</button>
      <button class="primary" id="btn-save">저장</button>
    </div>
    <input type="file" id="photo" accept="image/*" capture="environment" multiple hidden>
    <div class="thumbs" id="pending-thumbs"></div>

    <h2 class="date">최근 저장</h2>
    <div id="recent"></div>
  </section>

  <section id="view-list" hidden>
    <div class="filters">
      <input type="search" id="q" placeholder="장소 / 품목 / 금액 검색">
      <select id="status">
        <option value="OPEN">미완료</option>
        <option value="DONE">완료</option>
        <option value="">전체</option>
      </select>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-settle" hidden>
    <div id="settlements"></div>
  </section>

  <section id="view-import" hidden>
    <p class="hint">
      Keep 등에 쌓인 미완료 메모를 한 줄에 하나씩 붙여넣으면 각각 기록으로 만듭니다.
      실패한 줄은 원문 그대로 돌려주니 손으로 처리하면 됩니다.
    </p>
    <textarea id="import-text" rows="12" placeholder="5/28 원조해장촌 2인세트 4.5 소주2 1.0&#10;5/29 택시 8100&#10;..."></textarea>
    <div class="row">
      <button class="primary" id="btn-import">일괄 등록</button>
    </div>
    <div id="import-result"></div>
  </section>
</main>

<div id="detail" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <strong id="detail-title">상세</strong>
      <button id="detail-close" class="icon">닫기</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<div id="toast"></div>

<!-- 자동완성 후보. 단일 값 필드에만 쓴다 (쉼표로 나열하는 태그는 datalist 가 매칭되지 않는다). -->
<datalist id="dl-categories"></datalist>
<datalist id="dl-payments"></datalist>

<script src="/app.js"></script>
</body>
</html>
