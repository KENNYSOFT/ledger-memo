spring:
  application:
    name: ledger-memo

  # 필수 설정은 기본값을 두지 않는다. 미주입 시 기동이 실패해야 한다 (fail-fast).
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USER}
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 관리한다. JPA 는 매핑 검증만 수행.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Instant 를 UTC 로 저장. 표시 시각(KST) 변환은 애플리케이션 책임.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 힙을 거치지 않고 디스크로 직행시킨다 (DESIGN.md 4).
      file-size-threshold: 0
      max-file-size: 8MB
      # 원본과 썸네일을 한 요청에 함께 올린다.
      max-request-size: 20MB

server:
  # 이미지에 담기는 기본값. 배포에서는 SERVER_PORT / SERVER_ADDRESS 환경변수로 덮어쓴다
  # (host 네트워크에서 루프백에만 리슨시키기 위함 — DESIGN.md 7.2).
  port: 8080
  forward-headers-strategy: framework

ledger:
  attachment:
    # 컨테이너에 마운트되는 호스트 디렉토리. 로컬 개발에서는 환경변수로 바꾼다.
    root: ${LEDGER_ATTACHMENT_ROOT:/data/att}
  auth:
    username: ${LEDGER_AUTH_USERNAME}
    # Argon2id 해시. 평문도 해시도 repo 에 두지 않는다 (DESIGN.md 6).
    password-hash: ${LEDGER_AUTH_PASSWORD_HASH}
    # remember-me 토큰 서명 키. 바뀌면 기존 자동 로그인이 모두 무효가 된다.
    remember-me-key: ${LEDGER_REMEMBER_ME_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
