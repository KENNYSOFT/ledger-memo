name: build

# 문서만 바뀐 push 는 빌드하지 않는다. native 빌드가 수 분씩 걸려서 md 한 줄 고칠 때마다
# 도는 것이 낭비다. 문서 외 파일이 하나라도 섞이면 정상적으로 전체가 돈다.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore: *docs

# A1 이 aarch64 이므로 ARM runner 를 쓴다. native image 는 크로스 컴파일이 불가능해
# x86 runner 산출물은 서버에서 실행되지 않는다 (DESIGN.md 7.1).
# public repo 는 ARM64 runner 가 무료다.

env:
  LEDGER_DB_URL: jdbc:mysql://127.0.0.1:3306/ledger_memo?connectionTimeZone=UTC
  LEDGER_DB_USER: root
  LEDGER_DB_PASSWORD: root

jobs:
  jvm:
    name: JVM 빌드 + 테스트
    runs-on: ubuntu-24.04-arm
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ledger_memo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --scan
      - name: 테스트 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7

  native:
    name: native image 빌드 + 스모크 테스트 (arm64)
    runs-on: ubuntu-24.04-arm
    # 스모크 테스트가 실제로 앱을 띄우므로 DB 가 필요하다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ledger_memo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew nativeCompile -x test --scan
      - name: 산출물 확인
        run: |
          ls -la build/native/nativeCompile/
          file build/native/nativeCompile/ledger-memo
          du -h build/native/nativeCompile/ledger-memo
      # JVM 테스트로는 native 전용 결함(Kotlin 메타데이터 누락 등)이 잡히지 않는다.
      # 바이너리를 실제로 띄워 로그인·저장·조회까지 왕복한다 (DESIGN.md 7.1).
      - name: 스모크 테스트
        run: ./scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-memo-arm64
          path: build/native/nativeCompile/ledger-memo
          retention-days: 7

  image:
    name: 컨테이너 이미지 → GHCR
    needs: [jvm, native]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ledger-memo-arm64
      - run: chmod +x ledger-memo
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI 레지스트리는 소문자만 허용한다. 계정명이 대문자(KENNYSOFT)라
      # github.repository 를 그대로 쓰면 invalid tag 로 실패한다.
      - name: 이미지 이름 소문자화
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
