name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A1 이 aarch64 이므로 ARM runner 를 쓴다. native image 는 크로스 컴파일이 불가능해
# x86 runner 산출물은 서버에서 실행되지 않는다 (DESIGN.md 7.1).
# public repo 는 ARM64 runner 가 무료다.

env:
  LEDGER_DB_URL: jdbc:mysql://127.0.0.1:3306/ledger_memo?connectionTimeZone=UTC
  LEDGER_DB_USER: root
  LEDGER_DB_PASSWORD: root

jobs:
  jvm:
    name: JVM 빌드 + 테스트
    runs-on: ubuntu-24.04-arm
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ledger_memo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  native:
    name: native image 빌드 (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew nativeCompile -x test
      - name: 산출물 확인
        run: |
          ls -la build/native/nativeCompile/
          file build/native/nativeCompile/ledger-memo
          du -h build/native/nativeCompile/ledger-memo
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-memo-arm64
          path: build/native/nativeCompile/ledger-memo
          retention-days: 7

  image:
    name: 컨테이너 이미지 → GHCR
    needs: [jvm, native]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ledger-memo-arm64
      - run: chmod +x ledger-memo
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
